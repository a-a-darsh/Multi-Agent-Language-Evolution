[project]
name = "language-evolution"
version = "0.1.0"
description = "Language Evolution Simulator - MVP 1: structured fictional language generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.7",
    "langchain-core>=1.7.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "pydantic>=2.7",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
